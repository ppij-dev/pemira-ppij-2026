schema: spec-driven

context: |
  Public open-source repository: git@github.com:ppij-dev/ppij-election-system.git
  Standalone, forkable, self-installable election product: PPIJ national and any satellite
  (korda/komsat) can fork and self-host their own instance on Cloudflare (Workers/Pages + D1 + R2).
  Stack: Hono (API & OIDC BFF on Cloudflare Worker) + Astro (mobile-first UI with bottom navigation,
  templui/shadcn-inspired styling, Tabler icons only, no emoji) + Cloudflare D1 (SQLite) + Cloudflare R2.
  Onboarding: "Deploy to Cloudflare" button, then a WordPress-style one-time /setup on the .pages.dev /
  .workers.dev address (60-minute window from first visit, first-browser claim) for One Login client, scope,
  Service API client, domain and email; the last step binds the first Admin Voting via One Login; /setup then
  returns 404 forever. README tells installers: "Kontak PPIJ Portal admin untuk meminta realm config untuk service".
  Roles (use these exact words):
    - Admin Voting: the election committee, all with equal rights, each an ACTIVE member inside the site's scope;
      the installer is labelled Technical Admin (no extra rights). A candidate can never be Admin Voting.
    - Admin Portal: admins of the membership portal (ppij-identity); never an admin of this site.
    - Pemilih (voter): eligible when a fresh One Login sign-in (<= 10 min) shows them ACTIVE inside the scope.
      No frozen roll, no cutoff. Confirms by typing the candidate's nickname; one atomic secret ballot;
      receipt code checked at /surat-suara#<code>.
  Data: Pemilih list, membership changes and per-click contacts come from the ppij-identity Service API
  (add-service-api, Phase 1.3). Phones are never stored. One election per site. No polling, no WebSockets,
  no bulk email, no background jobs; Dasbor refreshes by button. Whole site is noindex.
  User-facing copy: Bahasa Indonesia first, friendly/helpful/secure voice, JST timestamps, Tabler icons only.

rules:
  specs:
    - Use EARS-style SHALL statements; every requirement has at least one WHEN/THEN scenario
  tasks:
    - Each task group lands its own tests
